<script>(function(){const img=document.querySelector('.menu-wrap > img');if(!img)return;const active='assets/menu-objetos-cinza40.png';const map={desenhos:'assets/menu-desenhos-cinza40.png',objetos:active,espacos:'assets/menu-espacos-cinza40.png',posteres:'assets/menu-posteres-cinza40.png',publicacoes:'assets/menu-publicacoes-cinza40.png',pinturas:'assets/menu-pinturas-cinza40.png',sobre:'assets/menu-sobre-cinza40.png'};document.querySelectorAll('.menu .m').forEach(a=>{const key=[...a.classList].find(c=>c!=='m');a.addEventListener('mouseenter',()=>{if(map[key])img.src=map[key]});a.addEventListener('mouseleave',()=>{img.src=active})})})();</script></body></html>
