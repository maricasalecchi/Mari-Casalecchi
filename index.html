
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mari Casalecchi | Ilustradora e Designer Gráfica em São Paulo</title>

<meta name="description" content="Portfólio de Mari Casalecchi, ilustradora, designer gráfica e artista visual brasileira. Graphic designer, illustrator and visual artist based in São Paulo, Brazil.">

<meta name="author" content="Mari Casalecchi">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Mari Casalecchi | Illustrator & Graphic Designer">
<meta property="og:description" content="Portfólio de Mari Casalecchi — ilustradora, designer gráfica e artista visual brasileira.">
<meta property="og:url" content="https://maricasalecchi.com.br/">
<meta property="og:image" content="https://maricasalecchi.com.br/assets/strip.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mari Casalecchi | Illustrator & Graphic Designer">
<meta name="twitter:description" content="Brazilian illustrator, graphic designer and visual artist based in São Paulo.">

<link rel="canonical" href="https://maricasalecchi.com.br/">

<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="home">

<header class="site-header">
  <div class="title-wrap">
    <img src="assets/title.png" alt="Mari Casalecchi">
  </div>

  <div class="menu-wrap">
    <img src="assets/menu-even.png" alt="desenhos, objetos, espaços, pôsteres, publicações, pinturas, sobre">

    <nav class="menu" aria-label="Navegação principal">
      <a class="m desenhos" href="desenhos.html" aria-label="Desenhos"></a>
      <a class="m objetos" href="objetos.html" aria-label="Objetos"></a>
      <a class="m espacos" href="espacos.html" aria-label="Espaços"></a>
      <a class="m posteres" href="posteres.html" aria-label="Pôsteres"></a>
      <a class="m publicacoes" href="publicacoes.html" aria-label="Publicações"></a>
      <a class="m pinturas" href="pinturas.html" aria-label="Pinturas"></a>
      <a class="m sobre" href="sobre.html" aria-label="Sobre"></a>
    </nav>
  </div>
</header>

<section class="hero">
  <img src="assets/strip.png" alt="Trabalhos de ilustração, design gráfico e arte visual de Mari Casalecchi">
</section>

</main>

<script>
(function(){
  const img=document.querySelector('.menu-wrap > img');
  if(!img) return;

  const base='assets/menu-even.png';

  const map={
    desenhos:'assets/menu-desenhos-cinza40.png',
    objetos:'assets/menu-objetos-cinza40.png',
    espacos:'assets/menu-espacos-cinza40.png',
    posteres:'assets/menu-posteres-cinza40.png',
    publicacoes:'assets/menu-publicacoes-cinza40.png',
    pinturas:'assets/menu-pinturas-cinza40.png',
    sobre:'assets/menu-sobre-cinza40.png'
  };

  document.querySelectorAll('.menu .m').forEach(a=>{
    const key=[...a.classList].find(c=>c!=='m');

    a.addEventListener('mouseenter',()=>{
      if(map[key]) img.src=map[key];
    });

    a.addEventListener('mouseleave',()=>{
      img.src=base;
    });
  });
})();
</script>

</body>
</html>
