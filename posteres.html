<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pôsteres — Mari Casalecchi</title>
<meta name="description" content="Pôsteres de Mari Casalecchi.">
<link rel="stylesheet" href="posteres.css">
</head>
<body>
<main class="posters-page">
<header class="site-header">
  <a class="title-wrap" href="index.html"><img src="assets/title.png" alt="Mari Casalecchi"></a>
  <div class="menu-wrap">
    <img src="assets/menu-posteres-cinza40.png" alt="desenhos, objetos, espaços, pôsteres, publicações, pinturas, sobre">
    <nav class="menu" aria-label="Navegação principal">
      <a class="m desenhos" href="#desenhos" aria-label="Desenhos"></a>
      <a class="m objetos" href="#objetos" aria-label="Objetos"></a>
      <a class="m espacos" href="#espacos" aria-label="Espaços"></a>
      <a class="m posteres" href="posteres.html" aria-label="Pôsteres"></a>
      <a class="m publicacoes" href="#publicacoes" aria-label="Publicações"></a>
      <a class="m pinturas" href="#pinturas" aria-label="Pinturas"></a>
      <a class="m sobre" href="#sobre" aria-label="Sobre"></a>
    </nav>
  </div>
</header>
<section class="poster-grid" aria-label="Pôsteres">
  <a class="poster-card" href="laje-sp.html">
    <img class="cover" src="assets/posteres/laje-sp/laje6.jpg" alt="Laje SP">
    <span class="poster-title">laje sp</span>
  </a>
  <a class="poster-card" href="sheela.html">
    <img class="cover" src="assets/posteres/sheela/sheela1.jpg" alt="Sheela">
    <span class="poster-title">sheela</span>
  </a>
  <a class="poster-card" href="javali.html">
    <img class="cover" src="assets/posteres/javali/java07.jpg" alt="Javali">
    <span class="poster-title">javali</span>
  </a>
  <a class="poster-card" href="solov.html">
    <img class="cover" src="assets/posteres/solov/solov3.jpg" alt="Solov">
    <span class="poster-title">solov</span>
  </a>
</section>
</main>
<script>
(function(){
  const img=document.querySelector('.menu-wrap > img');
  if(!img) return;
  const active='assets/menu-posteres-cinza40.png';
  const map={desenhos:'assets/menu-desenhos-cinza40.png',objetos:'assets/menu-objetos-cinza40.png',espacos:'assets/menu-espacos-cinza40.png',posteres:active,publicacoes:'assets/menu-publicacoes-cinza40.png',pinturas:'assets/menu-pinturas-cinza40.png',sobre:'assets/menu-sobre-cinza40.png'};
  document.querySelectorAll('.menu .m').forEach(a=>{
    const key=[...a.classList].find(c=>c!=='m');
    a.addEventListener('mouseenter',()=>{ if(map[key]) img.src=map[key]; });
    a.addEventListener('mouseleave',()=>{ img.src=active; });
  });
})();
</script>
</body>
</html>
